# cargo-deny policy. Loosening anything here requires a `type:process` issue.

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Every license currently in the dependency graph is listed explicitly; a new
# license appearing in a dependency PR should fail CI and force a human decision.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
