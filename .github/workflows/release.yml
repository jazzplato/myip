name: Release

# Pushing a `v*` tag builds the release binaries, checksums them, attests their
# build provenance and creates a DRAFT GitHub Release; a human publishes it.
# `cargo publish` is never run here: it stays a deliberate maintainer action.
#
# Run "Release" by hand (workflow_dispatch) for a dry run: it verifies and builds
# everything and produces the checksums, but creates no release and no attestation.
# The optional `tag` input simulates a tag; a value that is not `v<Cargo.toml version>`
# must fail the run.
#
# No secrets are used, and no caches either (a poisoned cache must not reach a release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run only: tag to simulate (default v<Cargo.toml version>). A mismatch must fail."
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify tag and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the master ancestry check below needs history
      - run: rustup toolchain install --no-self-update
      - name: The tag must equal the Cargo.toml version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -re '.packages[] | select(.name == "myip") | .version')
          if [ "$EVENT_NAME" = push ]; then
            tag=$REF_NAME
          else
            tag=${INPUT_TAG:-v$version}
            echo "::notice::Dry run: simulating tag $tag. No release or attestation will be created."
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag '$tag' does not match Cargo.toml version '$version' (expected 'v$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: A release tag must point at a commit on master
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not reachable from master; release only reviewed commits"
            exit 1
          fi
      - name: Verify the crate packages (never publishes)
        run: cargo publish --dry-run --locked

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: rustup target add "$TARGET"
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export "CC_${TARGET//-/_}=musl-gcc"
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            # Do not depend on the Visual C++ runtime DLL being installed on the user's machine.
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target "$TARGET"
      - name: The binary reports the release version
        run: |
          bin=target/$TARGET/release/myip
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          out=$("$bin" --version)
          echo "$out"
          if [ "$out" != "myip $VERSION" ]; then
            echo "::error::'$bin --version' printed '$out', expected 'myip $VERSION'"
            exit 1
          fi
      - name: The Linux binary is static (runs in an empty scratch container)
        if: runner.os == 'Linux'
        run: |
          ctx=$(mktemp -d)
          cp "target/$TARGET/release/myip" "$ctx/myip"
          printf 'FROM scratch\nCOPY myip /myip\nENTRYPOINT ["/myip"]\n' > "$ctx/Dockerfile"
          docker build --quiet --tag myip-scratch "$ctx"
          out=$(docker run --rm myip-scratch --version)
          echo "$out"
          test "$out" = "myip $VERSION"
      - name: The Windows binary does not import the Visual C++ runtime
        if: runner.os == 'Windows'
        run: |
          if grep -aqi 'vcruntime' "target/$TARGET/release/myip.exe"; then
            echo "::error::myip.exe still imports the Visual C++ runtime"
            exit 1
          fi
      - name: Package
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name=myip-v$VERSION-$TARGET
          mkdir -p "stage/$name" dist
          bin=target/$TARGET/release/myip
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          cp "$bin" LICENSE README.md "stage/$name/"
          if [ "$ARCHIVE" = zip ]; then
            (cd stage && 7z a -tzip "../dist/$name.zip" "$name")
          else
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myip-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: checksums
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: myip-*
          merge-multiple: true
          path: dist
      - name: Exactly the five expected archives, then SHA256SUMS
        run: |
          cd dist
          expected=$(printf '%s\n' \
            "myip-v$VERSION-aarch64-apple-darwin.tar.gz" \
            "myip-v$VERSION-aarch64-unknown-linux-musl.tar.gz" \
            "myip-v$VERSION-x86_64-apple-darwin.tar.gz" \
            "myip-v$VERSION-x86_64-pc-windows-msvc.zip" \
            "myip-v$VERSION-x86_64-unknown-linux-musl.tar.gz" | LC_ALL=C sort)
          actual=$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected release files"
            echo "expected:"; echo "$expected"
            echo "actual:"; echo "$actual"
            exit 1
          fi
          mapfile -t files <<< "$expected"
          sha256sum -- "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          {
            echo "### Release files for v$VERSION"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    needs: [verify, checksums]
    # Only a real tag push gets here; a workflow_dispatch dry run stops after `checksums`.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release # the maintainer approves here when the environment has required reviewers
    permissions:
      contents: write # create the draft release and upload its assets; only this job needs it
      id-token: write # OIDC token for keyless signing of the attestation
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Checksums still match what the build jobs produced
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          ls -l
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* "${flags[@]}" \
            --draft --verify-tag --title "$TAG" --generate-notes \
            --notes "Draft created by the Release workflow. Verify a download with \`gh attestation verify <file> -R $GH_REPO\` and \`sha256sum --check SHA256SUMS\`."
