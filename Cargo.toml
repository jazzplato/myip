[package]
name = "myip"
version = "0.1.1"
authors = ["Richthofen <jazzplato@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jazzplato/myip"
repository = "https://github.com/jazzplato/myip"
documentation = "https://github.com/jazzplato/myip"
description = "Where am I on the network, and what will others see? Public IP from several providers, local interfaces, and container or Kubernetes identity."
keywords = ["ip", "cli", "network", "kubernetes", "container"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", "deny.toml", "rust-toolchain.toml"]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
if-addrs = { version = "0.15", features = ["link-local"] }
ureq = { version = "3", features = ["platform-verifier"] }
